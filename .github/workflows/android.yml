name: build-temproot-manager
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Compile and verify ARM64 broker and su client
        run: |
          set -eux
          mkdir -p app/src/main/assets/arm64
          (cd broker && go test ./... && go vet ./... && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../app/src/main/assets/arm64/trm-broker .)
          (cd client && go test ./... && go vet ./... && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../app/src/main/assets/arm64/trm-su .)
          file app/src/main/assets/arm64/*
      - name: Install Android 16 SDK
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify bundled payload
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/arm64/trm-broker'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/arm64/trm-su'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'classes.dex'
      - uses: actions/upload-artifact@v4
        with:
          name: TempRootManager-V0.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
